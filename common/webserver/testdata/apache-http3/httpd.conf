ServerRoot "/opt/httpd"
ServerName example.com
Listen 127.0.0.1:4433 https
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule http2_module modules/mod_http2.so
LoadModule http3_module modules/mod_http3.so
User www-data
Group www-data
ErrorLog /proc/self/fd/2
LogLevel warn
ServerTokens Prod
ServerSignature Off
TraceEnable Off
EnableMMAP Off
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 100
H3MaxConnections 256
H3Port 4433
H3MaxConcurrentStreams 100
H3QpackTableCapacity 0
H3QpackBlockedStreams 0
H3HandshakeTimeout 10
H3IdleTimeout 120
H3StreamTimeout 30
H3AltSvc Off
TypesConfig conf/mime.types
AddDefaultCharset UTF-8
DocumentRoot "/opt/httpd/htdocs"
<Directory "/opt/httpd/htdocs">
    Require all granted
    DirectoryIndex index.html
    FallbackResource /index.html
</Directory>
<VirtualHost 127.0.0.1:4433>
    SSLEngine on
    SSLCertificateFile /tmp/reference.crt
    SSLCertificateKeyFile /tmp/reference.key
    H3CertificatePath /tmp/reference.crt
    H3CertificateKeyPath /tmp/reference.key
    Protocols h3 h2 http/1.1
</VirtualHost>
