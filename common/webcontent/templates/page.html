<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{{.Description}}"><title>{{if .About}}About · {{end}}{{.Title}}</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/site.css"></head>
<body><header><a class="brand" href="/">{{.Title}}</a><nav><a href="/">Home</a><a href="/about">About</a></nav></header><main><p class="eyebrow">{{if .About}}About us{{else}}Welcome{{end}}</p><h1>{{.Title}}</h1><p class="intro">{{.Description}}</p>{{if .About}}<article>{{.Body}}</article>{{else}}<img class="landscape" src="/assets/landscape.svg" alt="Abstract landscape"><p><a class="button" href="/about">Learn more</a></p>{{end}}</main><footer>{{.Title}}</footer></body></html>
